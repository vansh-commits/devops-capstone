apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels: {{- include "helpdesk.labels" . | nindent 4 }}
    app: {{ .Release.Name }}-backend
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels: {app: {{ .Release.Name }}-backend}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-backend}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      # Wait for PostgreSQL so Alembic migrations don't crash-loop on first start
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h $(POSTGRES_HOST) -p 5432 -U healthcheck; do echo waiting for postgres; sleep 2; done"]
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-config}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext: {{- include "helpdesk.podSecurity" . | nindent 12 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-config}
            - secretRef: {name: {{ .Release.Name }}-postgres}
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/$(POSTGRES_DB)"
          # liveness = process alive; readiness = DB reachable, safe to receive traffic
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext: {{- include "helpdesk.podSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels: {{- include "helpdesk.labels" . | nindent 4 }}
    app: {{ .Release.Name }}-backend
spec:
  type: ClusterIP
  selector: {app: {{ .Release.Name }}-backend}
  ports:
    - {name: http, port: 8000, targetPort: http}
