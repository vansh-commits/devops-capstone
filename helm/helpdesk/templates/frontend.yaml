apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels: {{- include "helpdesk.labels" . | nindent 4 }}
    app: {{ .Release.Name }}-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: {app: {{ .Release.Name }}-frontend}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-frontend}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: BACKEND_HOST, value: "{{ .Release.Name }}-backend:8000"}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext: {{- include "helpdesk.podSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels: {{- include "helpdesk.labels" . | nindent 4 }}
    app: {{ .Release.Name }}-frontend
spec:
  type: ClusterIP
  selector: {app: {{ .Release.Name }}-frontend}
  ports:
    - {name: http, port: 80, targetPort: http}
