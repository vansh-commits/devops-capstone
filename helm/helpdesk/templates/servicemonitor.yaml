{{- if .Values.monitoring.serviceMonitor.enabled }}
# Tells the Prometheus Operator (kube-prometheus-stack) to scrape the backend /metrics endpoint.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
    release: {{ .Values.monitoring.serviceMonitor.releaseLabel }}
spec:
  selector:
    matchLabels: {app: {{ .Release.Name }}-backend}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
