# Apply once from your laptop:  kubectl apply -f argocd/helpdesk-application.yaml
# Argo CD then keeps the cluster in sync with helm/helpdesk on the main branch.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helpdesk
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/devops-capstone.git # <-- change me
    targetRevision: main
    path: helm/helpdesk
    helm:
      valueFiles:
        - values-gitops.yaml # image tags are bumped here by CI after every green build

  destination:
    server: https://kubernetes.default.svc
    namespace: helpdesk-gitops

  syncPolicy:
    automated:
      prune: true    # delete resources removed from Git
      selfHeal: true # undo manual kubectl changes
    syncOptions:
      - CreateNamespace=true
