# Grafana auto-loads this dashboard (sidecar watches ConfigMaps labelled grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: helpdesk-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  helpdesk-dashboard.json: |
    {
      "title": "HelpDesk API",
      "uid": "helpdesk-api",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "tags": [
        "helpdesk"
      ],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requests per second by endpoint",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (handler) (rate(http_requests_total{namespace=\"helpdesk\"}[1m]))",
              "legendFormat": "{{handler}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "p95 latency by endpoint",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, handler) (rate(http_request_duration_seconds_bucket{namespace=\"helpdesk\"}[5m])))",
              "legendFormat": "{{handler}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "5xx error rate",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(http_requests_total{namespace=\"helpdesk\",status=\"5xx\"}[1m])) or vector(0)",
              "legendFormat": "5xx"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Backend pods (HPA)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(kube_deployment_status_replicas_available{namespace=\"helpdesk\",deployment=\"helpdesk-backend\"})",
              "legendFormat": "pods"
            }
          ]
        }
      ]
    }
