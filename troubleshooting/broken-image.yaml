# Scenario 1 — ImagePullBackOff: the image tag does not exist in any registry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image
  namespace: helpdesk
  labels: {tier: troubleshooting}
spec:
  replicas: 1
  selector:
    matchLabels: {app: broken-image}
  template:
    metadata:
      labels: {app: broken-image, tier: troubleshooting}
    spec:
      containers:
        - name: web
          image: ghcr.io/example/helpdesk-frontend:does-not-exist
          env:
            - {name: BACKEND_HOST, value: "helpdesk-backend:8000"}
