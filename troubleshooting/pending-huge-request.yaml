# Scenario 4 — Pending: asks for more CPU/memory than any node has, so the scheduler cannot place it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending-huge-request
  namespace: helpdesk
  labels: {tier: troubleshooting}
spec:
  replicas: 1
  selector:
    matchLabels: {app: pending-huge-request}
  template:
    metadata:
      labels: {app: pending-huge-request, tier: troubleshooting}
    spec:
      containers:
        - name: web
          image: helpdesk-frontend:local
          imagePullPolicy: Never
          env:
            - {name: BACKEND_HOST, value: "helpdesk-backend:8000"}
          resources:
            requests: {cpu: "64", memory: 64Gi}
